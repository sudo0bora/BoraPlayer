name: Build All Platforms
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libgtk-3-dev
      - name: Install frontend dependencies
        run: npm install
      - name: Build Tauri Desktop
        uses: tauri-apps/tauri-action@v0.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: List bundle output (debug)
        shell: bash
        run: find src-tauri/target/release/bundle -type f || echo "bundle directory not found"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boraplayer-desktop-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*
            src-tauri/target/release/bundle/rpm/*
            src-tauri/target/release/bundle/appimage/*
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
          if-no-files-found: warn

  publish-release:
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
      - name: Flatten release files
        run: |
          mkdir -p flat
          find release-files -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" \) -exec cp {} flat/ \;
          ls -la flat/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: flat/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
